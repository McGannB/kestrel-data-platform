[project]
name = "kvcu"
version = "0.1.0"
description = "Kestrel Valley CU compliance data pipelines"
requires-python = ">=3.11"

[project.scripts]
kvcu = "kvcu.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["labs", "notebooks"]

[tool.ruff.lint]
# E/F = errors and bugs, I = import order, B = likely bugs (bugbear)
select = ["E", "F", "I", "B"]
ignore = [
    "B008",  # FastAPI uses function calls in defaults on purpose (Depends, Header, Query)
    "B905",  # zip(strict=...) - optional for this course
    "E501",  # long lines: `ruff format` handles layout
]